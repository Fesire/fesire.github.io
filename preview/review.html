<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fesire — Design preview</title><style>*{box-sizing:border-box}body{margin:0;background:#222;color:#f4f4f4;font:12px Arial,sans-serif}header{height:64px;display:flex;gap:12px;align-items:center;padding:10px 24px}header strong{margin-right:auto}button,a{background:none;color:inherit;border:1px solid #555;padding:10px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#eee;color:#111}.stage{overflow:auto;padding:0 24px 24px}iframe{display:block;width:390px;height:844px;border:1px solid #555;margin:auto;background:#000}footer{text-align:center;font-size:11px;padding:12px}</style></head><body><header><strong>Fesire. / Preview</strong><button data-width="320" aria-pressed="false">Small phone</button><button data-width="390" aria-pressed="true">Mobile</button><button data-width="768" aria-pressed="false">Tablet</button><button data-width="1280" aria-pressed="false">Desktop</button><a href="index.html">Open website ↗</a></header><div class="stage"><iframe id="preview" src="index.html?v=2" title="Fesire portfolio preview" allow="autoplay; fullscreen"></iframe></div><script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{document.querySelector('#preview').style.width=button.dataset.width+'px';document.querySelectorAll('button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));}));</script></body></html>
